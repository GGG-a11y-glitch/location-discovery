<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>NexGen Discovery Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4285F4;
            --star: #FBBC05;
            --bg: #ffffff;
            --card: #f8f9fa;
            --text: #202124;
            --radius: 30px;
        }

        body.theme-night {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #ffffff;
            --primary: #8ab4f8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.8s ease;
            overflow-x: hidden;
        }

        /* Loader */
        .full-loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.8s ease;
        }
        .pulse-loader {
            width: 80px; height: 80px;
            border: 4px solid var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* Hero Section */
        .hero {
            height: 50vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            color: white;
        }
        #hero-img {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: background-image 1.2s ease-in-out;
            z-index: -1;
            filter: brightness(0.6);
            transform: scale(1.1);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, var(--bg));
        }

        .hero-content { position: relative; z-index: 10; padding: 20px; }
        .city-badge {
            background: var(--primary);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
        }

        /* Radar Button */
        .radar-container { padding: 0 25px; margin-top: -35px; position: relative; z-index: 100; }
        .radar-btn {
            width: 100%; height: 70px;
            border-radius: 35px; border: none;
            background: var(--text); color: var(--bg);
            font-weight: 800; font-size: 1rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .radar-btn.active { background: var(--primary); color: white; animation: ripple 2s infinite; }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(66, 133, 244, 0); } 100% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0); } }

        /* Grid & Cards */
        .grid { padding: 25px; display: grid; gap: 20px; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 25px;
            border: 1px solid rgba(128,128,128,0.1);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            will-change: transform;
        }
        .card.near {
            border: 2px solid var(--primary);
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(66, 133, 244, 0.3);
        }

        .rating-chip {
            background: #fff9e6; color: #947600;
            padding: 4px 10px; border-radius: 8px;
            font-weight: 800; font-size: 0.9rem;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .theme-night .rating-chip { background: #2c2500; color: var(--star); }

        .reviews-text { font-size: 0.75rem; opacity: 0.6; margin-left: 5px; }
        .distance-tag { float: right; font-weight: 800; color: var(--primary); }
        
        .skeleton { height: 180px; background: linear-gradient(90deg, var(--card) 25%, var(--bg) 50%, var(--card) 75%); background-size: 200% 100%; animation: skeleton 1.5s infinite; border-radius: var(--radius); }
        @keyframes skeleton { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        .hidden { display: none; }
    </style>
</head>
<body class="theme-day">

    <div id="loader" class="full-loader">
        <div class="pulse-loader"></div>
        <p style="margin-top:20px; letter-spacing: 3px; font-size: 0.7rem;">LOCALIZZAZIONE INTELLIGENTE...</p>
    </div>

    <header class="hero">
        <div id="hero-img"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div id="city-tag" class="city-badge">Rilevamento...</div>
            <h1 id="welcome-title" style="font-size: 2.8rem; font-weight: 800; line-height: 1.1;">Benvenuto</h1>
            <p style="opacity: 0.9; margin-top: 10px;">I migliori posti intorno a te a piedi</p>
        </div>
    </header>

    <main>
        <div class="radar-container">
            <button id="radar-toggle" class="radar-btn">
                📡 ATTIVA RADAR PROSSIMITÀ
            </button>
        </div>

        <div id="skeleton-grid" class="grid">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <div id="places-grid" class="grid hidden"></div>
    </main>

    <script>
        // --- CONFIGURAZIONE ICONICA ---
        const CITY_ASSETS = {
            "Milano": "https://images.unsplash.com/photo-1513581166391-887a96ddeafd?q=80&w=1600", // Duomo
            "Roma": "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=1600",   // Colosseo
            "Napoli": "https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?q=80&w=1600", // Vesuvio
            "Firenze": "https://images.unsplash.com/photo-1541029071515-84cc54f84dc5?q=80&w=1600", // Duomo FI
            "Venezia": "https://images.unsplash.com/photo-1514890547357-a9ee288728e0?q=80&w=1600", // Canale
            "Torino": "https://images.unsplash.com/photo-1545314041-36473950a0fc?q=80&w=1600",  // Mole
            "Palermo": "https://images.unsplash.com/photo-1520114056694-9221e7371f65?q=80&w=1600",
            "Default": "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?q=80&w=1600"
        };

        // --- DATABASE LOCALE (Simulazione per 10 posti Top Rated) ---
        // Nota: In produzione qui verrebbero chiamate le API Google Places
        const MOCK_POIS = [
            { name: "Punto d'Interesse Storico", type: "Monumento", rating: 4.9, reviews: 12500, lat_off: 0.002, lon_off: 0.001 },
            { name: "Parco Urbano Reale", type: "Parco", rating: 4.7, reviews: 8400, lat_off: -0.003, lon_off: 0.002 },
            { name: "Cattedrale Monumentale", type: "Chiesa", rating: 4.8, reviews: 15600, lat_off: 0.001, lon_off: -0.004 },
            { name: "Museo d'Arte Moderna", type: "Museo", rating: 4.6, reviews: 9200, lat_off: 0.005, lon_off: 0.005 },
            { name: "Giardino Botanico", type: "Natura", rating: 4.5, reviews: 3200, lat_off: -0.001, lon_off: -0.002 },
            { name: "Piazza Storica", type: "Attrazione", rating: 4.7, reviews: 22000, lat_off: 0.003, lon_off: -0.001 },
            { name: "Basilica Antica", type: "Chiesa", rating: 4.4, reviews: 1100, lat_off: -0.004, lon_off: -0.003 },
            { name: "Belvedere Cittadino", type: "Panoramico", rating: 4.9, reviews: 450, lat_off: 0.006, lon_off: 0.001 },
            { name: "Galleria d'Arte Contemporanea", type: "Museo", rating: 4.3, reviews: 8500, lat_off: 0.002, lon_off: 0.004 },
            { name: "Biblioteca Storica", type: "Cultura", rating: 4.8, reviews: 500, lat_off: -0.002, lon_off: 0.006 }
        ];

        let state = {
            city: "Città",
            coords: null,
            isRadar: false,
            vibrated: new Set()
        };

        const init = async () => {
            handleTheme();
            await getLocation();
            
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 800);
            }, 2500);

            document.getElementById('radar-toggle').addEventListener('click', toggleRadar);
        };

        // --- GEOLOCALIZZAZIONE & REVERSE GEOCODING ---
        const getLocation = () => {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        state.coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        await getCityName(state.coords.lat, state.coords.lon);
                        render();
                        resolve();
                    }, () => {
                        state.city = "Italia";
                        updateUI();
                        resolve();
                    });
                }
            });
        };

        const getCityName = async (lat, lon) => {
            try {
                // API Gratuita per ottenere il nome della città dalle coordinate
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=it`);
                const data = await res.json();
                state.city = data.city || data.locality || "Tua Posizione";
                updateUI();
            } catch (e) {
                state.city = "Italia";
                updateUI();
            }
        };

        const updateUI = () => {
            document.getElementById('city-tag').innerText = state.city;
            document.getElementById('welcome-title').innerText = `Benvenuto a ${state.city}`;
            
            // Cambio immagine in base alla città
            const bgImg = CITY_ASSETS[state.city] || CITY_ASSETS["Default"];
            document.getElementById('hero-img').style.backgroundImage = `url(${bgImg})`;
        };

        // --- LOGICA RATING PONDERATO (Bayesian Average) ---
        // Un rating di 4.5 con 10.000 recensioni è meglio di un 5.0 con 2 recensioni.
        const calculateWeightedRating = (rating, reviews) => {
            // Formula semplificata: rating * (1 - e^(-reviews/500))
            // Penalizza i posti con pochissime recensioni
            return rating * (1 - Math.exp(-reviews / 500));
        };

        const render = () => {
            const grid = document.getElementById('places-grid');
            const skeleton = document.getElementById('skeleton-grid');
            
            // Generiamo i POI "vicini" all'utente
            const realPlaces = MOCK_POIS.map(p => {
                const lat = state.coords.lat + p.lat_off;
                const lon = state.coords.lon + p.lon_off;
                const dist = getDist(state.coords.lat, state.coords.lon, lat, lon);
                const wScore = calculateWeightedRating(p.rating, p.reviews);
                return { ...p, lat, lon, dist, wScore };
            });

            // Ordiniamo per Rating Ponderato (I migliori veramente)
            realPlaces.sort((a, b) => b.wScore - a.wScore);

            skeleton.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            realPlaces.forEach(p => {
                const isNear = p.dist < 0.4; // 400 metri per il radar

                if (isNear && state.isRadar && !state.vibrated.has(p.name)) {
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    state.vibrated.add(p.name);
                }

                const card = document.createElement('div');
                card.className = `card ${isNear && state.isRadar ? 'near' : ''}`;
                card.innerHTML = `
                    <span class="distance-tag">${(p.dist * 1000).toFixed(0)}m</span>
                    <div class="rating-chip">★ ${p.rating} <span class="reviews-text">(${p.reviews.toLocaleString()})</span></div>
                    <h3 style="margin: 12px 0 4px 0; font-weight:800;">${p.name}</h3>
                    <p style="font-size:0.8rem; opacity:0.7; font-weight:600; color:var(--primary)">${p.type}</p>
                    <button class="btn-share" onclick="share('${p.name}')" style="margin-top:15px; width:100%; padding:10px; border-radius:12px; border:1px solid var(--primary); background:none; color:var(--primary); font-weight:700">
                        INVITA UN AMICO
                    </button>
                `;
                grid.appendChild(card);
            });
        };

        // --- UTILITY ---
        const getDist = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        };

        const handleTheme = () => {
            const h = new Date().getHours();
            if (h < 7 || h > 19) document.body.classList.add('theme-night');
        };

        const toggleRadar = () => {
            state.isRadar = !state.isRadar;
            const btn = document.getElementById('radar-toggle');
            btn.classList.toggle('active');
            btn.innerText = state.isRadar ? "📡 RADAR ATTIVO" : "📡 ATTIVA RADAR PROSSIMITÀ";
            state.vibrated.clear();
            render();
        };

        const share = (name) => {
            const msg = `Sto andando a ${name}! Mi raggiungi?`;
            if (navigator.share) navigator.share({ title: 'Discovery', text: msg, url: window.location.href });
        };

        init();
    </script>
</body>
</html>
