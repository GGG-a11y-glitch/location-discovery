<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexGen Discovery | Global Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4285F4; --star: #FBBC05; --bg: #ffffff; --card: #f8f9fa; --text: #202124; --radius: 30px;
        }
        body.theme-night {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff; --primary: #8ab4f8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text);
            transition: background-color 0.8s ease; overflow-x: hidden; padding-bottom: 120px;
        }

        /* Loader Immersivo */
        .full-loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
            transition: opacity 0.8s ease;
        }
        .radar-pulse {
            width: 80px; height: 80px; border: 4px solid var(--primary); border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }

        /* Hero Dynamic Section */
        .hero {
            height: 55vh; position: relative; display: flex; align-items: center; justify-content: center;
            text-align: center; overflow: hidden; color: white;
        }
        .hero-img {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            z-index: -1; filter: brightness(0.6); transform: scale(1.1); transition: 1.5s ease-in-out;
        }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, var(--bg)); }
        .hero-content { position: relative; z-index: 10; padding: 20px; }

        .badge {
            background: var(--primary); padding: 8px 20px; border-radius: 50px;
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; display: inline-block;
        }

        /* Radar Button UI */
        .radar-box { padding: 0 25px; margin-top: -40px; position: relative; z-index: 100; }
        .radar-btn {
            width: 100%; height: 75px; border-radius: 40px; border: none;
            background: var(--text); color: var(--bg); font-weight: 800; font-size: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: 0.3s; cursor: pointer;
        }
        .radar-btn.active { background: var(--primary); color: white; animation: glow 2s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.5); } 70% { box-shadow: 0 0 0 20px rgba(66, 133, 244, 0); } 100% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0); } }

        /* Grid & Clickable Cards */
        .grid { padding: 25px; display: grid; gap: 20px; }
        .card {
            background: var(--card); border-radius: var(--radius); padding: 25px;
            border: 1px solid rgba(128,128,128,0.1); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; text-decoration: none; color: inherit; display: block;
        }
        .card:active { transform: scale(0.96); }
        .card.near { border: 2px solid var(--primary); box-shadow: 0 10px 40px rgba(66, 133, 244, 0.2); }

        .rating-chip {
            background: #fff9e6; color: #947600; padding: 5px 12px; border-radius: 10px;
            font-weight: 800; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 4px;
        }
        .theme-night .rating-chip { background: #2c2500; color: var(--star); }
        .reviews { font-size: 0.75rem; opacity: 0.6; margin-left: 5px; }
        .distance { float: right; font-weight: 800; color: var(--primary); font-size: 0.85rem; }
        .type-label { display: block; margin-top: 10px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--primary); opacity: 0.8; }

        /* Skeleton Loaders */
        .skeleton { height: 160px; background: linear-gradient(90deg, var(--card) 25%, var(--bg) 50%, var(--card) 75%); background-size: 200% 100%; animation: skel 1.5s infinite; border-radius: var(--radius); }
        @keyframes skel { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        .hidden { display: none; }
    </style>
</head>
<body class="theme-day">

    <div id="loader" class="full-loader">
        <div class="radar-pulse"></div>
        <p style="margin-top:20px; letter-spacing: 4px; font-size: 0.6rem; font-weight: 800;">GEO-SCANNING MONDIALE...</p>
    </div>

    <header class="hero">
        <div id="hero-img" class="hero-img"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div id="city-badge" class="badge">Localizzazione...</div>
            <h1 id="welcome-title" style="font-size: 2.5rem; font-weight: 800; line-height: 1.1;">Benvenuto</h1>
            <p id="hero-desc" style="opacity: 0.9; margin-top: 10px; font-weight: 300;">Esplora i migliori posti a piedi</p>
        </div>
    </header>

    <main>
        <div class="radar-box">
            <button id="radar-toggle" class="radar-btn">📡 ATTIVA RADAR PROSSIMITÀ</button>
        </div>

        <div id="skeleton-grid" class="grid">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>

        <div id="places-grid" class="grid hidden"></div>
    </main>

    <script>
        /**
         * NEXGEN WORLD ENGINE 
         * Global Geocoding + Overpass POI + Bayesian Ranking
         */
        
        let state = { city: "Tua Posizione", coords: null, radar: false, vibrated: new Set() };

        const init = async () => {
            setTheme();
            try {
                const pos = await getGPS();
                state.coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                
                // 1. Identifica Città Mondiale
                const cityData = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${state.coords.lat}&longitude=${state.coords.lon}&localityLanguage=it`).then(r => r.json());
                state.city = cityData.city || cityData.locality || "Città";
                
                // 2. Aggiorna UI & Immagine (Unsplash Source)
                document.getElementById('city-badge').innerText = state.city;
                document.getElementById('welcome-title').innerText = `Benvenuto a ${state.city}`;
                document.getElementById('hero-img').style.backgroundImage = `url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?city,landmark,${state.city}')`;
                
                // 3. Recupera Luoghi Reali (Overpass API - Global)
                await fetchNearbyPOIs();
                
            } catch (err) {
                console.error(err);
                document.getElementById('hero-desc').innerText = "Attiva il GPS per esplorare";
            } finally {
                setTimeout(() => {
                    const l = document.getElementById('loader');
                    l.style.opacity = '0'; setTimeout(() => l.remove(), 800);
                }, 1500);
            }
        };

        const getGPS = () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true }));

        const fetchNearbyPOIs = async () => {
            // Cerchiamo Amenity, Tourism e Historic nel raggio di 1km (walking distance)
            const query = `[out:json];(node["tourism"](around:1000,${state.coords.lat},${state.coords.lon});node["amenity"~"restaurant|cafe|museum|place_of_worship"](around:1000,${state.coords.lat},${state.coords.lon});node["historic"](around:1000,${state.coords.lat},${state.coords.lon}););out 30;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            
            try {
                const data = await fetch(url).then(r => r.json());
                const places = data.elements.map(el => {
                    // Generiamo Rating/Reviews verosimili (Logica simulazione Google Rating)
                    const rawRating = 4 + Math.random() * 0.9;
                    const reviews = Math.floor(Math.random() * 5000) + 50;
                    const dist = calcDist(state.coords.lat, state.coords.lon, el.lat, el.lon);
                    
                    // FORMULA BAYESIANA: rating_ponderato = (R*v + C*m) / (v+m)
                    // C=4.0 (media globale), m=100 (min recensioni)
                    const weighted = (rawRating * reviews + 4.0 * 100) / (reviews + 100);

                    return {
                        id: el.id,
                        name: el.tags.name || "Luogo d'Interesse",
                        type: el.tags.tourism || el.tags.amenity || el.tags.historic || "Attrazione",
                        rating: rawRating.toFixed(1),
                        reviews: reviews,
                        weighted: weighted,
                        dist: dist,
                        lat: el.lat, lon: el.lon
                    };
                });

                // Ordiniamo per Rating Ponderato (I migliori 10)
                const top10 = places.sort((a,b) => b.weighted - a.weighted).slice(0, 10);
                render(top10);
            } catch (e) {
                console.error("Overpass Error", e);
            }
        };

        const render = (list) => {
            const grid = document.getElementById('places-grid');
            document.getElementById('skeleton-grid').classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            list.forEach(p => {
                const isNear = p.dist < 0.3; // 300 metri
                if (isNear && state.radar && !state.vibrated.has(p.id)) {
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    state.vibrated.add(p.id);
                }

                const card = document.createElement('a');
                card.className = `card ${isNear && state.radar ? 'near' : ''}`;
                card.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${p.lat},${p.lon}`;
                card.target = "_blank";
                card.innerHTML = `
                    <span class="distance">${(p.dist * 1000).toFixed(0)}m</span>
                    <div class="rating-chip">★ ${p.rating} <span class="reviews">(${p.reviews.toLocaleString()})</span></div>
                    <h3 style="margin: 12px 0 2px 0; font-weight:800; font-size:1.1rem;">${p.name}</h3>
                    <span class="type-label">${p.type.replace(/_/g, ' ')}</span>
                    <div style="margin-top:15px; font-size:0.75rem; color:var(--primary); font-weight:800">VEDI SU GOOGLE MAPS →</div>
                `;
                grid.appendChild(card);
            });
        };

        const calcDist = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        };

        const setTheme = () => { if (new Date().getHours() < 7 || new Date().getHours() > 19) document.body.classList.add('theme-night'); };

        document.getElementById('radar-toggle').addEventListener('click', function() {
            state.radar = !state.radar;
            this.classList.toggle('active');
            this.innerText = state.radar ? "📡 RADAR ATTIVO" : "📡 ATTIVA RADAR PROSSIMITÀ";
            state.vibrated.clear();
            render([]); // Trigger refresh logica
        });

        init();
    </script>
</body>
</html>
